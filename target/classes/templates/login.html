<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Login | Student System</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
    <link rel="stylesheet" th:href="@{/css/site.css}"/>
</head>
<body>

<header>
    <h1>&#127979; Student Information System</h1>
    <span>Geeks4Learning &middot; NQF Level 5</span>
</header>

<div class="container mt-5" style="max-width:480px;">
    <div class="card">
        <div class="card-body">

            <h2 class="mb-4">Sign In</h2>

            <!-- Error message -->
            <!-- Error message -->
            <div th:if="${error != null and !#strings.isEmpty(error)}"
                 class="alert alert-danger"
                 th:text="${error}">
            </div>

            <!-- Logout confirmation -->
            <div class="alert alert-success" th:if="${logout}">
                You have been logged out successfully.
            </div>

            <!-- Login form with CSRF token -->
            <form th:action="@{/auth/login}" method="post">
                <input type="hidden"
                       th:name="${_csrf.parameterName}"
                       th:value="${_csrf.token}"/>

                <div class="mb-3">
                    <label class="form-label">Username</label>
                    <input type="text"
                           name="username"
                           class="form-control"
                           placeholder="Enter your username"
                           required/>
                </div>

                <div class="mb-3">
                    <label class="form-label">Password</label>
                    <input type="password"
                           name="password"
                           class="form-control"
                           placeholder="Enter your password"
                           required/>
                </div>

                <button type="submit" class="btn w-100">Sign In</button>
            </form>

            <!-- Test credentials -->
            <div class="mt-4" style="background:#E8F7F8; border-radius:6px; padding:16px;">
                <p style="font-size:13px; font-weight:bold; color:#006D77; margin-bottom:10px;">
                    Test Credentials
                </p>
                <table style="width:100%; font-size:13px; border-collapse:collapse;">
                    <thead>
                    <tr style="background:#006D77; color:white;">
                        <th style="padding:6px 10px; text-align:left;">Role</th>
                        <th style="padding:6px 10px; text-align:left;">Username</th>
                        <th style="padding:6px 10px; text-align:left;">Password</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr style="background:#f9f9f9;">
                        <td style="padding:6px 10px;">Student</td>
                        <td style="padding:6px 10px; font-family:monospace;">letlotlo</td>
                        <td style="padding:6px 10px; font-family:monospace;">student123</td>
                    </tr>
                    <tr>
                        <td style="padding:6px 10px;">Lecturer</td>
                        <td style="padding:6px 10px; font-family:monospace;">dr.smith</td>
                        <td style="padding:6px 10px; font-family:monospace;">lecturer123</td>
                    </tr>
                    <tr style="background:#f9f9f9;">
                        <td style="padding:6px 10px;">Admin</td>
                        <td style="padding:6px 10px; font-family:monospace;">admin</td>
                        <td style="padding:6px 10px; font-family:monospace;">admin123</td>
                    </tr>
                    </tbody>
                </table>
            </div>

        </div>
    </div>
</div>

<footer style="margin-top:40px;">
    &copy; 2026 Student Information System &mdash; All rights reserved
</footer>

</body>
</html>

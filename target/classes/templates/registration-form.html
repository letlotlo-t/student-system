<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Course Registration | Student System</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
    <link rel="stylesheet" th:href="@{/css/site.css}"/>
</head>
<body>

<div th:replace="~{layout :: header}"></div>
<div th:replace="~{layout :: nav}"></div>

<div class="container mt-4">
    <h2>Course Registration</h2>

    <div class="card">
        <div class="card-body">

            <div class="alert alert-success" th:if="${successMessage}" th:text="${successMessage}"></div>
            <div class="alert alert-danger" th:if="${businessError}" th:text="${businessError}"></div>

            <form th:action="@{/registration/submit}"
                  th:object="${registration}"
                  method="post"
                  id="reg-form"
                  class="row g-3" style="max-width:480px;">

                <div class="col-12">
                    <label class="form-label">Course Code</label>
                    <input th:field="*{courseCode}" type="text" class="form-control" placeholder="e.g. SD501"/>
                    <div class="text-danger small mt-1" th:if="${#fields.hasErrors('courseCode')}"
                         th:errors="*{courseCode}"></div>
                </div>

                <div class="col-12">
                    <label class="form-label">Student ID</label>
                    <input th:field="*{studentId}" type="number" class="form-control" placeholder="e.g. 1001"/>
                    <div class="text-danger small mt-1" th:if="${#fields.hasErrors('studentId')}"
                         th:errors="*{studentId}"></div>
                </div>

                <div class="col-12">
                    <label class="form-label">Enrolment Date</label>
                    <input th:field="*{enrolmentDate}" type="date" class="form-control"/>
                    <div class="text-danger small mt-1" th:if="${#fields.hasErrors('enrolmentDate')}"
                         th:errors="*{enrolmentDate}"></div>
                </div>

                <div class="col-12">
                    <label class="form-label">Credits</label>
                    <input th:field="*{credits}" type="number" class="form-control" placeholder="e.g. 8"/>
                    <div class="text-danger small mt-1" th:if="${#fields.hasErrors('credits')}"
                         th:errors="*{credits}"></div>
                </div>

                <div class="col-12">
                    <button type="button" id="reg-btn" class="btn">Register</button>
                </div>

            </form>
        </div>
    </div>
</div>

<!-- Confirmation modal -->
<div id="reg-modal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.45); z-index:200; justify-content:center; align-items:center;">
    <div style="background:white; border-radius:8px; padding:28px 32px; max-width:400px; width:90%; box-shadow:0 4px 24px rgba(0,0,0,0.18);">
        <h4 style="color:#006D77; margin-bottom:12px;">Confirm Registration</h4>
        <p style="font-size:14px; color:#666; margin-bottom:20px;">Confirm course registration?</p>
        <div class="d-flex gap-2 justify-content-end">
            <button id="reg-cancel-btn" class="btn btn-outline-secondary">Cancel</button>
            <button id="reg-confirm-btn" class="btn" style="background:#E29578; color:white;">Confirm</button>
        </div>
    </div>
</div>

<div th:replace="~{layout :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/jquery.min.js}"></script>
<script>
    $(document).ready(function () {
        $('#reg-btn').on('click', function (e) {
            e.preventDefault();
            $('#reg-modal').css('display', 'flex');
        });
        $('#reg-confirm-btn').on('click', function () {
            $('#reg-modal').css('display', 'none');
            $('#reg-form').submit();
        });
        $('#reg-cancel-btn').on('click', function () {
            $('#reg-modal').css('display', 'none');
        });
        $('#reg-modal').on('click', function (e) {
            if (e.target === this) $(this).css('display', 'none');
        });
    });
</script>

</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Student Dashboard | Student System</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
    <link rel="stylesheet" th:href="@{/css/site.css}"/>
</head>
<body>

<div th:replace="~{layout :: header}"></div>
<div th:replace="~{layout :: nav}"></div>

<div class="container mt-4">

    <h2 th:text="'Welcome back, ' + ${studentName} + '!'">Welcome!</h2>

    <!-- Grades card -->
    <div class="card mb-4">
        <div class="card-body">
            <h3>My Grades</h3>
            <div th:insert="~{fragments/grades :: gradesSection}"></div>
        </div>
    </div>

    <!-- Profile card -->
    <div class="card mb-4">
        <div class="card-body">
            <h3>My Profile</h3>
            <div th:insert="~{fragments/profile :: profileSection}"></div>
        </div>
    </div>

    <!-- Success message -->
    <div th:if="${saveSuccess}"
         class="alert alert-success">
        &#10003; Profile updated successfully.
    </div>

    <!-- Edit profile form -->
    <div class="card mb-4">
        <div class="card-body">
            <h3>Edit Profile</h3>
            <form th:action="@{/student/profile/save}"
                  th:object="${profileForm}"
                  method="post"
                  id="profile-form"
                  class="row g-3" style="max-width:480px;">
                <div class="col-12">
                    <label class="form-label">Full Name</label>
                    <input th:field="*{fullName}" type="text" class="form-control" placeholder="Enter your full name"/>
                </div>
                <div class="col-12">
                    <label class="form-label">Email Address</label>
                    <input th:field="*{email}" type="email" class="form-control" placeholder="Enter your email"/>
                </div>
            </form>
            <button type="button" id="save-btn" class="btn mt-3">Save Changes</button>
        </div>
    </div>

</div>

<!-- Confirmation modal -->
<div id="confirm-modal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.45); z-index:200; justify-content:center; align-items:center;">
    <div style="background:white; border-radius:8px; padding:28px 32px; max-width:400px; width:90%; box-shadow:0 4px 24px rgba(0,0,0,0.18);">
        <h4 style="color:#006D77; margin-bottom:12px;">Confirm Action</h4>
        <p style="font-size:14px; color:#666; margin-bottom:20px;">Save changes to your profile?</p>
        <div class="d-flex gap-2 justify-content-end">
            <button id="modal-cancel-btn" class="btn btn-outline-secondary">Cancel</button>
            <button id="modal-confirm-btn" class="btn" style="background:#E29578; color:white;">Confirm</button>
        </div>
    </div>
</div>

<div th:replace="~{layout :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/jquery.min.js}"></script>
<script>
    $(document).ready(function () {
        $('#save-btn').on('click', function (e) {
            e.preventDefault();
            $('#confirm-modal').css('display', 'flex');
        });
        $('#modal-confirm-btn').on('click', function () {
            $('#confirm-modal').css('display', 'none');
            $('#profile-form').submit();
        });
        $('#modal-cancel-btn').on('click', function () {
            $('#confirm-modal').css('display', 'none');
        });
        $('#confirm-modal').on('click', function (e) {
            if (e.target === this) $(this).css('display', 'none');
        });
    });
</script>

</body>
</html>
